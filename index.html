
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sacred Heart Arts and Science College</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* College Header */

        .name {
            background-color: #8b0000;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .name h1 {
            font-size: 32px;
        }

        .name h4 {
            margin-top: 10px;
        }

        /* Navigation Bar */

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 17px;
        }

        nav a:hover {
            color: orange;
        }

        /* Banner */

        .banner {
            height: 400px;

            background:
            linear-gradient(rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)),
            url("https://images.unsplash.com/photo-1562774053-701939374585?w=1600")
            center/cover;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
            padding: 20px;
        }

        .banner h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .banner p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        /* Apply Button */

        button {
            background-color: orangered;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 17px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        /* Course Section */

        .courses {
            padding: 40px 8%;
        }

        .courses h2 {
            text-align: center;
            color: darkred;
            margin-bottom: 25px;
        }

        .course-box {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        .course-box h3 {
            color: darkred;
            margin-bottom: 15px;
        }

        .course-box ul {
            padding-left: 25px;
            line-height: 2;
        }

        /* Footer */

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive Design */

        @media screen and (max-width: 768px) {

            .name h1 {
                font-size: 23px;
            }

            nav a {
                display: inline-block;
                margin: 8px;
                font-size: 14px;
            }

            .banner {
                height: 320px;
            }

            .banner h1 {
                font-size: 27px;
            }

            .banner p {
                font-size: 16px;
            }

            .courses {
                padding: 25px 5%;
            }

        }

    </style>
</head>

<body>

    <!-- College Header -->

    <div class="name">

        <h1>SACRED HEART ARTS AND SCIENCE COLLEGE</h1>

        <h4>Madurai</h4>

    </div>

    <!-- Navigation -->

    <nav>

        <a href="index.html">Home</a>

        <a href="courses.html">Courses</a>

        <a href="admission.html">Admission</a>

        <a href="contact.html">Contact</a>

    </nav>

    <!-- Home Banner -->

    <section class="banner">

        <h1>Welcome to Sacred Heart College</h1>

        <p>Education is the key to success</p>

        <button onclick="location.href='admission.html'">
            Apply Now
        </button>

    </section>

    <!-- Footer -->

    <footer>

        <p>© 2026 Sacred Heart Arts and Science College</p>

        <p>Madurai, Tamil Nadu</p>

    </footer>

</body>
</html>
